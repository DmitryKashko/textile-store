services:
  app:
    build: .
    volumes:
      - .:/var/www/html
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started

  queue:
    build: .
    command: php artisan queue:work --tries=3 --backoff=10
    volumes:
      - .:/var/www/html
    depends_on:
      - app

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: textile_store
      MYSQL_USER: textile
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "33060:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-psecret", "-utextile"]
      interval: 5s
      retries: 20

  redis:
    image: redis:7-alpine

volumes:
  mysql-data:
